# Runs the backend against a real Postgres, the way it runs when deployed.
# For everyday development, `npm run dev` (embedded PGlite) needs no Docker at all.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cradle
      POSTGRES_PASSWORD: cradle
      POSTGRES_DB: cradle
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://cradle:cradle@postgres:5432/cradle
      SERVER_SECRET: ${SERVER_SECRET:-dev-secret-change-me}
      NODE_ENV: production
    ports: ["8080:8080"]
    depends_on: [postgres]
volumes:
  postgres-data:
